<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ashen Oath: The Road Between Crowns</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080d10; }
    body { color: #e7e0d0; font-family: Georgia, 'Times New Roman', serif; }
    #canvas { width: 100vw; height: 100vh; display: block; background: #080d10; outline: none; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; background: radial-gradient(circle at 68% 37%, rgba(218, 163, 82, .20), transparent 18%), linear-gradient(160deg, #18262b 0%, #0b1418 48%, #05080a 100%); }
    #boot::before { content: ''; position: absolute; inset: 0; opacity: .42; background: linear-gradient(118deg, transparent 0 50%, rgba(90, 120, 112, .24) 50.2% 50.8%, transparent 51%), linear-gradient(70deg, transparent 0 63%, rgba(42, 66, 70, .30) 63.2% 63.7%, transparent 64%); }
    #boot-card { position: relative; width: min(650px, 92vw); padding: 34px 38px 28px; text-align: center; }
    #crest { width: 72px; height: 72px; margin: 0 auto 18px; border: 1px solid rgba(214, 172, 99, .76); transform: rotate(45deg); display: grid; place-items: center; box-shadow: 0 0 40px rgba(212, 158, 75, .20); }
    #crest::before { content: 'ASH'; color: #e1b567; font: 700 13px system-ui, sans-serif; letter-spacing: .12em; transform: rotate(-45deg); }
    h1 { margin: 0; letter-spacing: .22em; font-size: clamp(28px, 5vw, 58px); font-weight: 500; }
    #subtitle { margin-top: 10px; color: #c6a877; letter-spacing: .16em; font-size: clamp(12px, 1.7vw, 18px); text-transform: uppercase; }
    #tagline { margin: 20px auto 18px; max-width: 460px; color: #9da9a5; font-size: 17px; line-height: 1.55; }
    #road { position: relative; width: 100%; height: 180px; margin: 6px 0 14px; border: 1px solid rgba(200, 170, 112, .20); background: rgba(4, 8, 10, .28); overflow: hidden; }
    #road-canvas { width: 100%; height: 100%; display: block; }
    #progress-track { height: 4px; margin: 12px auto 0; max-width: 460px; background: rgba(220, 208, 174, .16); }
    #progress { width: 0%; height: 100%; background: linear-gradient(90deg, #7b6b4a, #e1b567); transition: width .18s ease; }
    #status { min-height: 24px; margin-top: 10px; color: #a9b3ad; font: 13px/1.4 system-ui, sans-serif; }
    #start { margin-top: 14px; border: 1px solid #c8a767; background: #1c2a2b; color: #f3e6c7; padding: 11px 24px; font: 600 14px system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
    #start:hover, #start:focus-visible { background: #2b4140; box-shadow: 0 0 22px rgba(225, 181, 103, .22); outline: none; }
    #hint { margin-top: 10px; color: #72817e; font: 12px system-ui, sans-serif; }
    #build-meta { margin-top: 8px; color: #596864; font: 10px/1.3 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
    .hidden { display: none !important; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
  </style>
  
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="Ashen Oath game"></canvas>
  <section id="boot" aria-label="Ashen Oath loading screen">
    <div id="boot-card">
      <div id="crest" aria-hidden="true"></div>
      <h1>ASHEN OATH</h1>
      <div id="subtitle">The Road Between Crowns</div>
      <div id="tagline">Guide the witness through the branches while Greyfen wakes behind the veil.</div>
      <div id="road"><canvas id="road-canvas" width="650" height="180" aria-label="Crow Flight loading game"></canvas></div>
      <div id="progress-track" aria-hidden="true"><div id="progress"></div></div>
      <div id="status" role="status" aria-live="polite">Preparing the road. The game will open as soon as Greyfen is ready.</div>
      <button id="start" type="button" aria-label="Guide the crow while Ashen Oath loads">Guide the Crow</button>
      <div id="hint">Space, click, tap, or gamepad A to flap. This small game remains available while Ashen Oath loads.</div>
      <div id="build-meta" aria-label="Build information"></div>
    </div>
  </section>
  <script src="index.js"></script>
  <script>
    (() => {
      const boot = document.getElementById('boot');
      const start = document.getElementById('start');
      const status = document.getElementById('status');
      const progress = document.getElementById('progress');
      const road = document.getElementById('road-canvas');
      const buildMeta = document.getElementById('build-meta');
      const ctx = road.getContext('2d');
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const SHELL_BUILD_ID = "story-20261003T101232Z-85a80d0794e2";
      const RUNTIME_PACK_CONTRACT = "story-20261003T101232Z-85a80d0794e2";
      const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":14274448,"index.wasm":37700666},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
      let engine = null, started = false, ready = false, engineBooted = false, last = 0, score = 0;
      let gamepadPressed = false;
      const bootMetrics = {
        state: 'shell_ready',
        first_paint_ms: performance.now(),
        engine_start_ms: 0,
        engine_ready_ms: 0,
        progress_samples: 0,
        input_events: 0,
        last_input: '',
        crow_score: 0,
        build_id: SHELL_BUILD_ID,
        runtime_pack_contract: RUNTIME_PACK_CONTRACT,
      };
      window.__ashenOathBoot = bootMetrics;
      window.__ashenOathPreloadedPacks = {};
      document.documentElement.dataset.bootState = bootMetrics.state;
      buildMeta.textContent = SHELL_BUILD_ID + ' | packs ' + RUNTIME_PACK_CONTRACT;
      performance.mark('ashen-oath-first-paint');
      function setBootState(state, extra = {}) {
        bootMetrics.state = state;
        Object.assign(bootMetrics, extra);
        document.documentElement.dataset.bootState = state;
        window.dispatchEvent(new CustomEvent('ashen-oath-boot', { detail: { ...bootMetrics } }));
      }
      function setStatus(text) { status.textContent = text; }
      async function sha256Hex(payload) {
        if (!crypto?.subtle) throw new Error('browser SHA-256 support unavailable');
        return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', payload)))
          .map((value) => value.toString(16).padStart(2, '0')).join('');
      }
      async function prefetchOpeningPack() {
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 90000);
        window.__ashenOathPreloadedPacks.opening = { state: 'loading' };
        let packCache = null, packUrl = '';
        try {
          const releaseResponse = await fetch('release_manifest.json', { cache: 'no-cache', signal: controller.signal });
          if (!releaseResponse.ok) throw new Error(`release manifest HTTP ${releaseResponse.status}`);
          const release = await releaseResponse.json();
          if (String(release?.build_id || '') !== SHELL_BUILD_ID) {
            throw new Error(`shell build ${SHELL_BUILD_ID} != release ${release?.build_id || 'missing'}`);
          }
          const manifestResponse = await fetch('runtime_pack_manifest.json', { cache: 'no-cache', signal: controller.signal });
          if (!manifestResponse.ok) throw new Error(`runtime pack manifest HTTP ${manifestResponse.status}`);
          const manifestPayload = await manifestResponse.arrayBuffer();
          const manifestDigest = await sha256Hex(manifestPayload);
          if (manifestDigest !== String(release?.runtime_pack_manifest?.sha256 || '').toLowerCase()) {
            throw new Error(`runtime manifest SHA-256 ${manifestDigest} != ${release?.runtime_pack_manifest?.sha256 || 'missing'}`);
          }
          const manifest = JSON.parse(new TextDecoder().decode(manifestPayload));
          if (String(manifest?.release_id || '') !== SHELL_BUILD_ID) {
            throw new Error(`runtime pack release ${manifest?.release_id || 'missing'} != shell ${SHELL_BUILD_ID}`);
          }
          setBootState(bootMetrics.state, {
            release_compatibility_key: String(release?.compatibility_key || ''),
            runtime_manifest_sha256: manifestDigest,
          });
          const opening = manifest?.packs?.opening;
          if (!opening?.url) throw new Error('runtime pack manifest has no opening pack URL');
          packUrl = new URL(opening.url, window.location.href).href;
          setBootState(bootMetrics.state, { opening_prefetch_state: 'loading' });
          let packResponse = null;
          if ('caches' in window) {
            const cacheKey = String(release?.compatibility_key || manifestDigest).slice(0, 24);
            packCache = await caches.open(`ashenoath-runtime-packs-${cacheKey}`);
            packResponse = await packCache.match(packUrl);
            if (!packResponse) {
              const downloaded = await fetch(packUrl, { cache: 'no-cache', signal: controller.signal });
              if (!downloaded.ok) throw new Error(`opening pack HTTP ${downloaded.status}`);
              packResponse = downloaded;
            }
          } else {
            packResponse = await fetch(packUrl, { cache: 'force-cache', signal: controller.signal });
          }
          if (!packResponse.ok) throw new Error(`opening pack HTTP ${packResponse.status}`);
          const payload = await packResponse.arrayBuffer();
          if (opening.bytes > 0 && payload.byteLength !== opening.bytes) {
            throw new Error(`opening pack bytes ${payload.byteLength} != ${opening.bytes}`);
          }
          if (!opening.sha256) throw new Error('opening pack SHA-256 contract unavailable');
          const digest = await sha256Hex(payload);
          if (digest !== String(opening.sha256).toLowerCase()) {
            throw new Error(`opening pack SHA-256 ${digest} != ${opening.sha256}`);
          }
          // Cache only verified bytes. Quota failures must not discard a valid pack.
          if (packCache) await packCache.put(packUrl, new Response(payload)).catch(() => {});
          const preload = {
            state: 'verified',
            path: '/opening.pck',
            url: packUrl,
            version: String(opening.version || ''),
            bytes: payload.byteLength,
            sha256: digest,
          };
          window.__ashenOathPreloadedPacks.opening = preload;
          setBootState(bootMetrics.state, {
            opening_prefetch_state: 'ready',
            opening_prefetch_bytes: payload.byteLength,
          });
          return { ...preload, payload };
        } catch (error) {
          if (packCache && packUrl) await packCache.delete(packUrl).catch(() => {});
          // Godot retains authoritative retry, hash verification, and error UI.
          // A shell prefetch failure must not prevent the engine from starting.
          setBootState(bootMetrics.state, {
            opening_prefetch_state: 'failed',
            opening_prefetch_error: String(error),
          });
          window.__ashenOathPreloadedPacks.opening = { state: 'failed', error: String(error) };
          return null;
        } finally {
          window.clearTimeout(timeout);
        }
      }
      let openingFetchPromise = null;
      let openingPreloadPromise = null;
      async function mountOpeningPackAfterReady() {
        if (openingPreloadPromise) return openingPreloadPromise;
        openingPreloadPromise = (async () => {
          const openingPreload = await (openingFetchPromise || (openingFetchPromise = prefetchOpeningPack()));
          if (!openingPreload) {
            window.dispatchEvent(new CustomEvent('ashenoath-opening-pack', { detail: { state: 'failed' } }));
            return null;
          }
          try {
            if (!engineBooted || !engine) throw new Error('engine is not ready for opening pack mount');
            engine.copyToFS(openingPreload.path, openingPreload.payload);
            const { payload, ...metadata } = openingPreload;
            openingFetchPromise = null;
            window.__ashenOathPreloadedPacks.opening = { ...metadata, state: 'preloaded' };
            setBootState(bootMetrics.state, { opening_prefetch_state: 'preloaded' });
            window.dispatchEvent(new CustomEvent('ashenoath-opening-pack', {
              detail: { ...metadata, state: 'preloaded' },
            }));
            return metadata;
          } catch (error) {
            const detail = { state: 'failed', error: String(error) };
            window.__ashenOathPreloadedPacks.opening = detail;
            setBootState(bootMetrics.state, {
              opening_prefetch_state: 'failed',
              opening_prefetch_error: String(error),
            });
            window.dispatchEvent(new CustomEvent('ashenoath-opening-pack', { detail }));
            console.error(error);
            return null;
          }
        })();
        return openingPreloadPromise;
      }
      window.__ashenOathBeginOpeningPackMount = mountOpeningPackAfterReady;
      let crowY = 90, crowVelocity = 0, branchOffset = 0, nextBranch = 260;
      const branches = [];
      const ember = { x: 460, y: 72, active: true };
      function flap(source = 'pointer') {
        if (!started || ready) return;
        crowVelocity = -4.8;
        bootMetrics.input_events += 1;
        bootMetrics.last_input = source;
      }
      function resetBranch() { const gap = 70 + Math.random() * 35; const top = 18 + Math.random() * 48; branches.push({ x: road.width + 30, top, bottom: top + gap }); }
      function draw() {
        const w = road.width, h = road.height;
        ctx.clearRect(0, 0, w, h); ctx.fillStyle = '#09171b'; ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = 'rgba(112, 148, 135, .16)';
        for (let i = 0; i < 10; i++) { const x = (i * 82 - branchOffset * (i % 2 ? .35 : .18)) % (w + 60) - 30; ctx.beginPath(); ctx.moveTo(x, h); ctx.lineTo(x + 34, 36 + (i % 3) * 12); ctx.lineTo(x + 62, h); ctx.fill(); }
        ctx.strokeStyle = 'rgba(211, 177, 110, .24)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, h - 22); ctx.bezierCurveTo(w * .25, h * .62, w * .60, h * .92, w, h * .55); ctx.stroke();
        ctx.fillStyle = '#d8b56d'; ctx.shadowColor = '#d8b56d'; ctx.shadowBlur = 14; if (ember.active) { ctx.beginPath(); ctx.arc(ember.x, ember.y, 5, 0, Math.PI * 2); ctx.fill(); } ctx.shadowBlur = 0;
        ctx.fillStyle = '#070b0e'; ctx.strokeStyle = '#b7c2b9'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(110, crowY, 15, 9, -.12, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.moveTo(122, crowY - 1); ctx.lineTo(136, crowY - 6); ctx.lineTo(124, crowY + 4); ctx.fill(); ctx.fillStyle = '#f1d796'; ctx.beginPath(); ctx.arc(120, crowY - 4, 1.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(22, 35, 36, .92)'; for (const branch of branches) { ctx.fillRect(branch.x, 0, 18, branch.top); ctx.fillRect(branch.x, branch.bottom, 18, h - branch.bottom); }
        ctx.fillStyle = '#c8a767'; ctx.font = '12px system-ui'; ctx.fillText('embers ' + score, 14, 22);
      }
      function tick(time) {
        const dt = Math.min(2.0, (time - last) / 16.67 || 1); last = time;
        if (started && !ready && !reduce) {
          crowVelocity += .22 * dt; crowY += crowVelocity * dt; branchOffset += 1.1 * dt; nextBranch -= 1.55 * dt; ember.x -= 1.7 * dt; if (ember.x < -12) { ember.x = road.width + 12; ember.y = 30 + Math.random() * 110; ember.active = true; }
          for (const branch of branches) branch.x -= 1.55 * dt; while (nextBranch <= 0) { resetBranch(); nextBranch = 150 + Math.random() * 100; } while (branches.length && branches[0].x < -30) branches.shift();
          if (Math.abs(crowY - ember.y) < 18 && Math.abs(110 - ember.x) < 24 && ember.active) { score++; ember.active = false; bootMetrics.crow_score = score; setStatus('The road remembers. Ember ' + score + ' gathered.'); }
          if (crowY < 8 || crowY > road.height - 8 || branches.some((b) => 110 > b.x - 15 && 110 < b.x + 28 && (crowY < b.top || crowY > b.bottom))) { crowY = 90; crowVelocity = 0; branches.length = 0; nextBranch = 260; setStatus('The crow circles back. Keep the oath alive.'); }
        }
        draw(); requestAnimationFrame(tick);
      }
      window.addEventListener('keydown', (event) => { if ([' ', 'ArrowUp', 'w', 'W'].includes(event.key)) { event.preventDefault(); flap('keyboard'); } });
      road.addEventListener('pointerdown', () => flap('pointer'));
      start.addEventListener('click', () => {
        if (engineBooted && window.__ashenOathOpeningState?.state === 'failed') {
          ready = true;
          boot.classList.add('hidden');
          document.getElementById('canvas').focus();
        } else if (!started) begin();
        else flap('button');
      });
      function pollGamepad() {
        let pressed = false;
        if (started && !ready && navigator.getGamepads) {
          const pad = Array.from(navigator.getGamepads()).find(Boolean);
          pressed = Boolean(pad?.buttons?.[0]?.pressed);
          if (pressed && !gamepadPressed) flap('gamepad');
        }
        gamepadPressed = pressed;
        requestAnimationFrame(pollGamepad);
      }
      async function begin() {
        if (started) return;
        started = true;
        ready = false;
        start.textContent = 'Flap the Crow';
        start.setAttribute('aria-label', 'Flap the crow while Ashen Oath loads');
        setStatus('Opening the road while you fly.');
        bootMetrics.engine_start_ms = performance.now();
        performance.mark('ashen-oath-engine-start');
        setBootState('engine_starting');
        openingPreloadPromise = null;
        openingFetchPromise = prefetchOpeningPack();
        let engineLoadPromise = null;
        try {
          engine = new Engine(GODOT_CONFIG);
          engineLoadPromise = Engine.load(
            GODOT_CONFIG.executable,
            GODOT_CONFIG.fileSizes?.[`${GODOT_CONFIG.executable}.wasm`],
          );
          await engineLoadPromise;
        } catch (error) {
          setRetryState('The road could not be opened. Choose Retry to try again.', { error: String(error) });
          console.error(error);
          return;
        }
        const missing = Engine.getMissingFeatures({ threads: false });
        if (missing.length) { setRetryState('This browser is missing WebGL 2.0: ' + missing.join(', '), { missing_features: missing }); console.error(status.textContent); return; }
        setBootState('loading');
        engine.startGame({ onProgress: (current, total) => { const ratio = current > 0 && total > 0 ? current / total : 0; const visibleRatio = Math.min(0.92, ratio); bootMetrics.progress_samples += 1; progress.style.width = `${Math.round(visibleRatio * 100)}%`; setStatus(ratio >= 1 ? 'Runtime files are ready. Preparing Greyfen...' : (ratio > 0 ? `Opening the road... ${Math.round(visibleRatio * 100)}%` : 'Opening the road...')); } }).then(() => {
          engineBooted = true;
          void mountOpeningPackAfterReady();
          bootMetrics.engine_ready_ms = performance.now();
          performance.mark('ashen-oath-engine-ready');
          setBootState('opening_preparing', { engine_ready_elapsed_ms: Math.round(bootMetrics.engine_ready_ms - bootMetrics.engine_start_ms) });
          setStatus('Runtime ready. Preparing Greyfen\'s first view...');
          waitForOpeningReady();
        }, (error) => { setRetryState('The road could not be opened. Choose Retry to try again.', { error: String(error) }); console.error(error); });
      }
      function waitForOpeningReady() {
        const opening = window.__ashenOathOpeningState;
        if (opening?.state === 'ready') {
          ready = true;
          progress.style.width = '100%';
          setBootState('ready', { opening_ready_ms: performance.now() });
          setStatus(opening.message || 'Greyfen is ready. Enter the road.');
          boot.classList.add('hidden');
          console.log('LOADING: shell opening_ready');
          document.getElementById('canvas').focus();
          return;
        }
        if (opening?.state === 'failed') {
          setBootState('opening_failed', { opening_error: opening.message || 'Opening preparation failed' });
          setStatus(opening.message || 'Greyfen could not be prepared. Open the menu to retry.');
          start.textContent = 'Open Retry Menu';
          start.setAttribute('aria-label', 'Open the Ashen Oath retry menu');
          return;
        }
        window.setTimeout(waitForOpeningReady, 50);
      }
      function setRetryState(message, extra = {}) {
        started = false;
        ready = false;
        engineBooted = false;
        engine = null;
        setBootState('failed', extra);
        setStatus(message);
        start.textContent = 'Retry';
        start.setAttribute('aria-label', 'Retry opening Ashen Oath');
      }
      draw(); requestAnimationFrame(tick); requestAnimationFrame(pollGamepad);
      window.setTimeout(begin, 0);
    })();
  </script>
</body>
</html>
